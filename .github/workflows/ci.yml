name: CI/CD Pipeline

on:
  push:
    branches:
      - trunk  # This will trigger the pipeline when code is pushed to the trunk branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # The environment to run the job

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2  # This checks out your code from the GitHub repository

      - name: Build Project (optional)
        run: |
          # This step is optional; you can build your project if you have build tools like React or Angular.
          echo "Building project..."

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch to deploy to GitHub Pages
          folder: ./        # The folder containing the project files (in our case, it's the root folder)